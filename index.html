<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odds Lens</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--sf:#fff;--ink:#0E1726;--mut:#5B6776;--ln:#E1E5EA;--ac:#0F766E;--acbg:#E3F3F1;--ng:#B42318;--ngbg:#FBE9E7;--hd:#0B1320;--imp:#C4CBD3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C121A;--sf:#141C26;--ink:#E8EDF2;--mut:#8D9AA9;--ln:#243040;--ac:#3DC7B6;--acbg:#10302D;--ng:#F28B7D;--ngbg:#3A1C19;--hd:#070C13;--imp:#3A4757;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0C121A;--sf:#141C26;--ink:#E8EDF2;--mut:#8D9AA9;--ln:#243040;--ac:#3DC7B6;--acbg:#10302D;--ng:#F28B7D;--ngbg:#3A1C19;--hd:#070C13;--imp:#3A4757;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Schibsted Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0)}
button,select,input{font:inherit;color:inherit}
header{background:var(--hd);color:#E8EDF2;padding-top:env(safe-area-inset-top,0)}
.hi{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.br{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.br small{display:block;font-weight:400;font-size:12px;color:#8D9AA9;letter-spacing:0}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:#9AA7B5;padding:8px 14px;cursor:pointer;border-radius:6px;white-space:nowrap}
nav button[aria-selected=true]{background:#1B2838;color:#fff;font-weight:500}
.tl{display:flex;gap:6px}
.bt{background:transparent;border:1px solid #2C3A4B;color:#C9D3DD;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px}
.ctl .bt{border-color:var(--ln);color:var(--ink);background:var(--sf)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
.bn{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--mut);margin-bottom:14px}
.bn.demo{background:var(--ngbg);color:var(--ng);padding:9px 12px;border-radius:8px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k,.cd{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px}
.k span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.k b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.k small{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 10px;font-weight:700}h3{margin:2px 0 8px;font-size:17px}h3 i{font-style:normal;color:var(--mut);font-weight:400;font-size:13px}
.pos{color:var(--ac)}.neg{color:var(--ng)}.mt{color:var(--mut);font-size:13px}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mut);font-size:9px}.ch .bd{fill:var(--ink);font-size:11px;font-weight:700}
.zl{stroke:var(--ln);stroke-width:1}.ar{fill:var(--acbg)}.ln2{fill:none;stroke:var(--ac);stroke-width:2}.f1{fill:var(--ac)}.f2{fill:var(--imp)}.f3{fill:var(--ng)}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:14px}
.ctl label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.ctl select{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;min-width:130px}
input[type=range]{accent-color:var(--ac);width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px}
.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}.r1{font-size:12px;color:var(--mut)}
.pk{background:var(--acbg);color:var(--ac);padding:2px 10px;border-radius:99px;font-weight:500;font-size:13px}
.edge{font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{display:grid;grid-template-columns:64px 1fr 48px;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:6px}.bar b{color:var(--ink);text-align:right;font-weight:500}
.trk{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}.trk i{display:block;height:100%}.trk .f1{background:var(--ac)}.trk .f2{background:var(--imp)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--ln)}.kv span{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:13px;font-weight:500}
.cd .tw{border:0;border-radius:0}.cd table{min-width:0}.cd th,.cd td{padding:8px 6px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--mut)}tr:last-child td{border:0}
.pl{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}.pl.W{background:var(--acbg);color:var(--ac)}.pl.L{background:var(--ngbg);color:var(--ng)}.pl.V,.pl.P{background:var(--bg);color:var(--mut)}
.dots{display:flex;gap:3px;margin-bottom:8px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--imp)}.dots .W{background:var(--ac)}.dots .L{background:var(--ng)}
.nx{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.nx:last-child{border:0}
details{margin-top:12px;font-size:14px;color:var(--mut)}summary{cursor:pointer;color:var(--ink);font-weight:500}
footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--ln);font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><div class="hi">
 <div class="br"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#0F766E"/><path d="M6 19l5-6 4 3 7-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div>Odds Lens<small id="tg"></small></div></div>
 <nav role="tablist" id="nv"></nav>
 <div class="tl"><button class="bt" id="im"></button><input type="file" id="fi" accept=".json" hidden><button class="bt" id="th" aria-label="Theme">◐</button><button class="bt" id="lg"></button></div>
</div></header>
<main>
 <div id="bn" class="bn"></div>
 <section id="ov"></section><section id="sg" hidden></section><section id="hs" hidden></section><section id="an" hidden></section>
 <footer id="ft"></footer>
</main>
<script>
const T={es:{tg:"Análisis de cuotas y probabilidades",ov:"Resumen",sg:"Señales",hs:"Historial",an:"Analítica",im:"Importar JSON",demo:"Datos de ejemplo. Se reemplazan automáticamente cuando el agente publique datos reales.",live:"Datos reales",upd:"actualizado",rows:"señales",empty:"Sin datos todavía.",kopen:"Señales abiertas",kset:"Liquidadas",khit:"Acierto",kroi:"Resultado (1 u/señal)",kclv:"CLV medio",kedge:"Ventaja media",exp:"esperado",small:"muestra pequeña: no concluyas aún",units:"unidades",ccurve:"Resultado acumulado (unidades)",cnext:"Próximas señales",cclv:"Distribución del CLV (%)",ccal:"Calibración: acierto real vs esperado",clg:"Por liga",cbk:"Por casa de apuestas",league:"Liga",book:"Casa",minedge:"Ventaja mínima",sort:"Ordenar",sedge:"Ventaja",sko:"Inicio",result:"Resultado",all:"Todos",W:"Acertó",L:"Falló",V:"Nula",P:"Pendiente",model:"Modelo",impl:"Implícita",odds:"Cuota",fair:"Cuota justa",ko:"inicio",in:"en",ago:"hace",date:"Fecha",event:"Evento",pick:"Selección",close:"Cierre",units1:"Unidades",real:"Real",expd:"Esperado",met:"Metodología",mtx:"La probabilidad justa sale de la línea de Pinnacle sin margen (o del consenso de casas si no está). Ventaja = probabilidad justa − probabilidad implícita de la mejor cuota. EV = probabilidad × cuota − 1. CLV = cuota tomada × probabilidad justa al cierre − 1: si es positivo de forma sostenida en cientos de señales, es la mejor evidencia de valor real. Los resultados de corto plazo son ruido.",ft:"Solo mayores de 18 años. Herramienta de análisis e información: no garantiza resultados ni es asesoría de apuestas. El juego puede causar adicción; juega con responsabilidad. Las normas varían según el país.",bad:"Archivo no válido"},
en:{tg:"Odds and probability analysis",ov:"Overview",sg:"Signals",hs:"History",an:"Analytics",im:"Import JSON",demo:"Sample data. It is replaced automatically once the agent publishes real data.",live:"Live data",upd:"updated",rows:"signals",empty:"No data yet.",kopen:"Open signals",kset:"Settled",khit:"Hit rate",kroi:"Result (1 u/signal)",kclv:"Average CLV",kedge:"Average edge",exp:"expected",small:"small sample: don’t conclude yet",units:"units",ccurve:"Cumulative result (units)",cnext:"Upcoming signals",cclv:"CLV distribution (%)",ccal:"Calibration: actual vs expected hit rate",clg:"By league",cbk:"By bookmaker",league:"League",book:"Book",minedge:"Minimum edge",sort:"Sort",sedge:"Edge",sko:"Kickoff",result:"Result",all:"All",W:"Won",L:"Lost",V:"Void",P:"Pending",model:"Model",impl:"Implied",odds:"Odds",fair:"Fair odds",ko:"kickoff",in:"in",ago:"ago",date:"Date",event:"Event",pick:"Selection",close:"Closing",units1:"Units",real:"Actual",expd:"Expected",met:"Methodology",mtx:"Fair probability comes from Pinnacle’s line with the margin removed (or the consensus of books if it’s missing). Edge = fair probability − the implied probability of the best price. EV = probability × odds − 1. CLV = odds taken × closing fair probability − 1: if it stays positive over hundreds of signals, it’s the best evidence of real value. Short-term results are noise.",ft:"18+ only. Analysis and information tool: it does not guarantee results and is not betting advice. Gambling can be addictive; play responsibly. Rules vary by country.",bad:"Invalid file"}};
const $=(s,r=document)=>r.querySelector(s),$$=s=>document.querySelectorAll(s);
let L=(navigator.language||"es").slice(0,2)==="en"?"en":"es",D=[],demo=true,GEN="",TAB="ov";
try{const s=localStorage.getItem("ol-lang");if(s==="en"||s==="es")L=s;const h=localStorage.getItem("ol-theme");if(h)document.documentElement.dataset.theme=h}catch(e){}
const t=k=>T[L][k]||k,pct=x=>(x*100).toFixed(1)+"%",sg=(x,d=1)=>(x>=0?"+":"")+x.toFixed(d),cl=v=>v==null?"":v>=0?"pos":"neg";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=ms=>new Intl.DateTimeFormat(L,{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(ms);
function rel(ms){const d=ms-Date.now(),h=Math.round(Math.abs(d)/36e5),s=h<48?h+" h":Math.round(h/24)+" d";return d>0?t("in")+" "+s:t("ago")+" "+s}
function norm(r){const odds=+r.odds,p=+r.fair_p,c=+r.close_p||0,res=r.result==="W"||r.result==="L"?r.result:r.result?"V":null;
 return{home:esc(r.home),away:esc(r.away),league:esc(r.league),sel:esc(r.selection),book:esc(r.book),odds,p,edge:+r.edge,close:c,res,ko:Date.parse(r.commence)||0,iss:Date.parse(r.issued)||0,clv:c?odds*c-1:null,ev:p*odds-1}}
function mk(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647,N=["Atlas","Norte","Sur","Costa","Lions","Rovers","Unión","Deportivo","Olimpia","Racing","Verde","Blanco","Tigres","Águilas","Blue","Stars"],LG=["Premier League","La Liga","NBA","Champions League"],BK=["Unibet","Betfair","Bet365","Betway"],now=Date.now(),o=[];
 for(let i=0;i<72;i++){const open=i<9,p=.3+r()*.35,e=.05+r()*.07,ko=open?now+(.2+r()*3)*864e5:now-(72-i)*.6*864e5,a=N[Math.floor(r()*16)];
  o.push({home:a,away:N[(N.indexOf(a)+1+Math.floor(r()*14))%16],league:LG[Math.floor(r()*4)],selection:a,book:BK[Math.floor(r()*4)],odds:+(1/(p-e)).toFixed(2),fair_p:p,edge:e,commence:new Date(ko).toISOString(),issued:new Date(open?now-r()*864e5:ko-(.4+r())*864e5).toISOString(),close_p:1/(1/(p-e))+e*.12+(r()-.5)*.03,result:open?null:(r()<1/(1/(p-e))+.012?"W":"L")})}return o}
function st(a){const s=a.filter(r=>r.res==="W"||r.res==="L"),n=s.length,w=s.filter(r=>r.res==="W").length,u=s.reduce((q,r)=>q+(r.res==="W"?r.odds-1:-1),0),c=s.filter(r=>r.clv!=null),av=(x,f)=>x.length?x.reduce((q,r)=>q+f(r),0)/x.length:null;
 return{n,hit:n?w/n:null,u,roi:n?u/n:null,clv:av(c,r=>r.clv),exp:av(s,r=>r.p),edge:av(a,r=>r.edge)}}
const isOpen=r=>!r.res&&r.ko>Date.now(),setl=()=>D.filter(r=>r.res==="W"||r.res==="L");
function bar(l,v,c){return `<div class="bar"><span>${l}</span><div class="trk"><i class="${c}" style="width:${Math.min(v,1)*100}%"></i></div><b>${pct(v)}</b></div>`}
function bars(it,fm){const W=360,H=150,pb=20,n=it.length,mx=Math.max(...it.flatMap(i=>i.v),1e-9),sw=W/n;
 return `<svg viewBox="0 0 ${W} ${H}" class="ch">`+it.map((i,k)=>{const m=i.v.length,bw=Math.min(26,(sw-4)/m);return i.v.map((v,j)=>{const h=(H-pb-14)*v/mx,x=k*sw+(sw-bw*m)/2+j*bw;return `<rect x="${x}" y="${H-pb-h}" width="${bw-1}" height="${h}" rx="2" class="${i.c[j]}"/>`+(v?`<text x="${x+bw/2}" y="${H-pb-h-3}" text-anchor="middle">${fm(v)}</text>`:"")}).join("")+`<text x="${k*sw+sw/2}" y="${H-5}" text-anchor="middle">${i.l}</text>`}).join("")+`</svg>`}
function curve(a){const s=[...a].sort((x,y)=>x.iss-y.iss);let c=0;const P=s.map(r=>(c+=r.res==="W"?r.odds-1:-1,[r.iss,c]));if(P.length<2)return `<p class="mt">${t("empty")}</p>`;
 const W=600,H=170,x0=P[0][0],x1=P[P.length-1][0],ys=P.map(p=>p[1]).concat(0),mn=Math.min(...ys),mx=Math.max(...ys),X=v=>10+(W-20)*(v-x0)/((x1-x0)||1),Y=v=>12+(H-24)*(1-(v-mn)/((mx-mn)||1)),d=P.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
 return `<svg viewBox="0 0 ${W} ${H}" class="ch"><line x1="10" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" class="zl"/><path d="${d}L${X(x1)} ${Y(0)}L${X(x0)} ${Y(0)}Z" class="ar"/><path d="${d}" class="ln2"/><text x="${W-10}" y="${Math.max(Y(c)-6,10)}" text-anchor="end" class="bd">${sg(c)} u</text></svg>`}
function kpi(l,v,sub,c){return `<div class="k"><span>${l}</span><b class="${c||""}">${v}</b><small>${sub||"&nbsp;"}</small></div>`}
function renderOv(){const s=st(D),o=D.filter(isOpen).sort((a,b)=>b.edge-a.edge),last=setl().sort((a,b)=>b.iss-a.iss).slice(0,24).reverse();
 $("#ov").innerHTML=`<div class="kp">${kpi(t("kopen"),o.length,"")}${kpi(t("kset"),s.n,s.n<100?t("small"):"")}${kpi(t("khit"),s.n?pct(s.hit):"–",s.n?t("exp")+" "+pct(s.exp):"")}${kpi(t("kroi"),s.n?sg(s.u)+" u":"–",s.n?"ROI "+sg(s.roi*100)+"%":"",cl(s.n?s.u:null))}${kpi(t("kclv"),s.clv==null?"–":sg(s.clv*100)+"%","",cl(s.clv))}${kpi(t("kedge"),s.edge==null?"–":pct(s.edge),"")}</div>
 <div class="g2"><div class="cd"><h2>${t("ccurve")}</h2><div class="dots">${last.map(r=>`<i class="${r.res}"></i>`).join("")}</div>${curve(setl())}</div>
 <div class="cd"><h2>${t("cnext")}</h2>${o.slice(0,6).map(r=>`<div class="nx"><span>${r.home} <span class="mt">vs ${r.away}</span><br><span class="mt">${r.sel} · ${r.book}</span></span><b class="pos">+${(r.edge*100).toFixed(1)}%</b></div>`).join("")||`<p class="mt">${t("empty")}</p>`}</div></div>`}
function card(r){return `<article class="sc"><div class="r1"><span>${r.league}</span><span>${t("ko")} ${rel(r.ko)}</span></div><h3>${r.home} <i>vs</i> ${r.away}</h3><div class="r2"><span class="pk">${r.sel}</span><b class="edge pos">+${(r.edge*100).toFixed(1)}%</b></div>${bar(t("model"),r.p,"f1")}${bar(t("impl"),1/r.odds,"f2")}<div class="kv"><div><span>${t("odds")}</span><b>${r.odds.toFixed(2)}</b></div><div><span>${t("fair")}</span><b>${(1/r.p).toFixed(2)}</b></div><div><span>EV</span><b>${sg(r.ev*100)}%</b></div><div><span>${t("book")}</span><b>${r.book}</b></div></div></article>`}
const V=id=>{const e=$("#"+id);return e?e.value:""};
function renderLists(){const me=+V("sg-me")/100;$("#sg-mv").textContent=pct(me);
 const so=V("sg-so"),a=D.filter(r=>isOpen(r)&&r.edge>=me&&(!V("sg-lg")||r.league===V("sg-lg"))&&(!V("sg-bk")||r.book===V("sg-bk"))).sort((x,y)=>so==="ko"?x.ko-y.ko:so==="ev"?y.ev-x.ev:y.edge-x.edge);
 $("#sgl").innerHTML=a.map(card).join("")||`<p class="mt">${t("empty")}</p>`;
 const h=hist();$("#hsl").innerHTML=`<div class="tw"><table><thead><tr><th>${t("date")}</th><th>${t("event")}</th><th>${t("pick")}</th><th>${t("book")}</th><th>${t("odds")}</th><th>${t("close")}</th><th>CLV</th><th>${t("units1")}</th><th>${t("result")}</th></tr></thead><tbody>${h.slice(0,200).map(r=>{const u=r.res==="W"?r.odds-1:r.res==="L"?-1:0;return `<tr><td>${fd(r.iss)}</td><td>${r.home} – ${r.away}</td><td>${r.sel}</td><td>${r.book}</td><td>${r.odds.toFixed(2)}</td><td>${r.close?(1/r.close).toFixed(2):"–"}</td><td class="${cl(r.clv)}">${r.clv==null?"–":sg(r.clv*100)+"%"}</td><td class="${cl(u)}">${sg(u,2)}</td><td><span class="pl ${r.res||"P"}">${t(r.res||"P")}</span></td></tr>`}).join("")}</tbody></table></div>`}
function hist(){return D.filter(r=>r.res||r.ko<=Date.now()).filter(r=>(!V("hs-lg")||r.league===V("hs-lg"))&&(!V("hs-bk")||r.book===V("hs-bk"))&&(!V("hs-rs")||r.res===V("hs-rs"))).sort((a,b)=>b.iss-a.iss)}
function grp(k){const m={};D.forEach(r=>(m[r[k]]=m[r[k]]||[]).push(r));return `<div class="tw"><table><thead><tr><th>${t(k)}</th><th>N</th><th>${t("khit")}</th><th>ROI</th><th>CLV</th></tr></thead><tbody>${Object.entries(m).map(([n,v])=>[n,st(v)]).sort((a,b)=>b[1].n-a[1].n).map(([n,s])=>`<tr><td>${n}</td><td>${s.n}</td><td>${s.n?pct(s.hit):"–"}</td><td class="${cl(s.roi)}">${s.n?sg(s.roi*100)+"%":"–"}</td><td class="${cl(s.clv)}">${s.clv==null?"–":sg(s.clv*100)+"%"}</td></tr>`).join("")}</tbody></table></div>`}
function renderAn(){const S=setl().filter(r=>r.clv!=null),B=[];for(let x=-10;x<14;x+=2)B.push({l:x,v:[S.filter(r=>r.clv*100>=x&&r.clv*100<x+2).length],c:[x<0?"f3":"f1"]});
 const bk=[[.05,.07],[.07,.09],[.09,.12],[.12,1]].map(([a,b])=>{const s=st(setl().filter(r=>r.edge>=a&&r.edge<b));return{l:b>=1?`${Math.round(a*100)}+%`:`${Math.round(a*100)}–${Math.round(b*100)}%`,v:[s.hit||0,s.exp||0],c:["f1","f2"],n:s.n}});
 $("#an").innerHTML=`<div class="g3"><div class="cd"><h2>${t("cclv")}</h2>${bars(B,v=>v)}</div><div class="cd"><h2>${t("ccal")}</h2>${bars(bk,v=>Math.round(v*100)+"")}<p class="mt"><span class="pos">■</span> ${t("real")} &nbsp; <span style="color:var(--imp)">■</span> ${t("expd")}</p></div></div>
 <div class="g3"><div class="cd"><h2>${t("clg")}</h2>${grp("league")}</div><div class="cd"><h2>${t("cbk")}</h2>${grp("book")}</div></div><details><summary>${t("met")}</summary><p>${t("mtx")}</p></details>`}
function opts(id,k){const e=$("#"+id);if(!e)return;const v=e.value;e.innerHTML=`<option value="">${t("all")}</option>`+[...new Set(D.map(r=>r[k]))].sort().map(x=>`<option>${x}</option>`).join("");e.value=v}
function init(){$("#sg").innerHTML=`<div class="ctl"><label>${t("league")}<select id="sg-lg"></select></label><label>${t("book")}<select id="sg-bk"></select></label><label>${t("minedge")}: <output id="sg-mv"></output><input type="range" id="sg-me" min="0" max="15" step=".5" value="0"></label><label>${t("sort")}<select id="sg-so"><option value="edge">${t("sedge")}</option><option value="ko">${t("sko")}</option><option value="ev">EV</option></select></label></div><div id="sgl" class="grid"></div>`;
 $("#hs").innerHTML=`<div class="ctl"><label>${t("league")}<select id="hs-lg"></select></label><label>${t("book")}<select id="hs-bk"></select></label><label>${t("result")}<select id="hs-rs"><option value="">${t("all")}</option><option value="W">${t("W")}</option><option value="L">${t("L")}</option><option value="V">${t("V")}</option></select></label><button class="bt" id="csv">CSV</button></div><div id="hsl"></div>`;
 $("#nv").innerHTML=["ov","sg","hs","an"].map(k=>`<button role="tab" data-v="${k}" aria-selected="${k===TAB}">${t(k)}</button>`).join("");
 $("#tg").textContent=t("tg");$("#im").textContent=t("im");$("#lg").textContent=L==="es"?"EN":"ES";$("#ft").textContent=t("ft");document.documentElement.lang=L;
 ["ov","sg","hs","an"].forEach(k=>$("#"+k).hidden=k!==TAB);refresh()}
function refresh(){opts("sg-lg","league");opts("sg-bk","book");opts("hs-lg","league");opts("hs-bk","book");
 const b=$("#bn");b.className="bn"+(demo?" demo":"");b.innerHTML=demo?`<span>${t("demo")}</span>`:`<span>${t("live")} · ${D.length} ${t("rows")}</span><span>${t("upd")} ${GEN?fd(Date.parse(GEN)):""}</span>`;
 renderOv();renderLists();renderAn()}
function setData(o,save){if(!o||!Array.isArray(o.rows))throw 0;D=o.rows.slice(0,1000).map(norm).filter(r=>r.odds>1);demo=false;GEN=String(o.generated||"");
 if(save)try{localStorage.setItem("ol-data",JSON.stringify(o))}catch(e){}refresh()}
document.addEventListener("input",e=>{if(e.target.closest("#sg,#hs"))renderLists()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b){TAB=b.dataset.v;init()}
 if(e.target.id==="csv"){const h=hist(),q=["date,event,pick,book,odds,close,clv,result",...h.map(r=>[new Date(r.iss).toISOString(),`"${r.home} - ${r.away}"`,`"${r.sel}"`,r.book,r.odds,r.close?(1/r.close).toFixed(3):"",r.clv==null?"":r.clv.toFixed(4),r.res||""].join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([q],{type:"text/csv"}));a.download="odds-lens-history.csv";a.click()}});
$("#lg").onclick=()=>{L=L==="es"?"en":"es";try{localStorage.setItem("ol-lang",L)}catch(e){}init()};
$("#th").onclick=()=>{const d=document.documentElement,n=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("ol-theme",n)}catch(e){}};
$("#im").onclick=()=>$("#fi").click();
$("#fi").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)f.text().then(x=>setData(JSON.parse(x),true)).catch(()=>{$("#bn").textContent=t("bad")})};
D=mk().map(norm);
try{const s=localStorage.getItem("ol-data");if(s)setData(JSON.parse(s),false)}catch(e){}
init();
(()=>{let u="data/signals.json";const h=location.hostname;
 if(h.endsWith(".github.io")){const r=location.pathname.split("/")[1];if(r)u=`https://raw.githubusercontent.com/${h.split(".")[0]}/${r}/main/data/signals.json`}
 fetch(u+"?t="+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(o=>{if(String(o.generated||"")>GEN)setData(o,false)}).catch(()=>{})})();
</script>
</body>
</html>
